name: ResearchLens RAG CI

on:
  push:
    branches: [ main, master, "feat/*", "rag/*" ]
    paths:
      - 'rag/**'
      - 'backend/app/integrations/**'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/rag_ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'rag/**'
      - 'backend/app/integrations/**'
      - 'scripts/**'
      - 'requirements.txt'

jobs:
  test-rag:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        run: |
          PYTHONPATH=. pytest rag/tests/ -v --durations=10

      - name: Run Benchmark Evaluation
        run: |
          PYTHONPATH=. python scripts/evaluate_rag.py
