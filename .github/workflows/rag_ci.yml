name: ResearchLens CI

on:
  push:
    branches: [ main, develop, "feature/*", "fix/*", "chore/*" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Python Backend and RAG Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r backend/requirements.txt

      - name: Run Pytest Suite
        run: |
          PYTHONPATH=. pytest -v --durations=10

  frontend:
    name: Frontend Tests and Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Tests
        run: |
          cd frontend
          npm test

      - name: Verify Frontend Production Build
        run: |
          cd frontend
          npm run build
